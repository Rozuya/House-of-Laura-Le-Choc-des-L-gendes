<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Draft Manager - Phase de Draft</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card-container { display: flex; justify-content: center; gap: 20px; margin: 30px 0; flex-wrap: wrap; }
        .player-card { background: #1e293b; border: 3px solid #eab308; border-radius: 12px; width: 200px; padding: 20px; cursor: pointer; transition: 0.2s; }
        .player-card:hover { transform: scale(1.05); }
        .player-card.legend { border-color: #cbd5e1; background: linear-gradient(135deg, #334155, #0f172a); }
        .rating { font-size: 2rem; font-weight: bold; color: #eab308; }
        .legend .rating { color: #f8fafc; }
        .squad-grid { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        .squad-slot { background: #1e293b; border: 1px dashed #475569; padding: 10px; border-radius: 6px; width: 130px; }
    </style>
</head>
<body>
    <h2>Phase de Draft</h2>
    <p id="info-step" style="color: #38bdf8;"></p>
    
    <div class="card-container" id="choices"></div>

    <h3>Ton Équipe Actuelle</h3>
    <div class="squad-grid" id="squad-preview"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode') || 'normal';

        const normalPool = [
            { name: "Kylian Mbappé", pos: "BU", rating: 91 },
            { name: "Erling Haaland", pos: "BU", rating: 91 },
            { name: "Vinicius Jr", pos: "AG", rating: 89 },
            { name: "Kevin De Bruyne", pos: "MOC", rating: 91 },
            { name: "Jude Bellingham", pos: "MC", rating: 86 },
            { name: "Rodri", pos: "MC", rating: 89 },
            { name: "Virgil van Dijk", pos: "DC", rating: 89 },
            { name: "William Saliba", pos: "DC", rating: 87 },
            { name: "Theo Hernandez", pos: "DG", rating: 85 },
            { name: "Achraf Hakimi", pos: "DD", rating: 84 },
            { name: "Thibaut Courtois", pos: "GB", rating: 90 },
            { name: "Ronaldinho (Légende)", pos: "AG", rating: 95, legend: true },
            { name: "Zinedine Zidane (Légende)", pos: "MOC", rating: 96, legend: true },
            { name: "Pelé (Légende)", pos: "BU", rating: 98, legend: true }
        ];

        const lauraPool = [
            { name: "Vespera", pos: "GB", rating: 97, legend: true },
            { name: "Ninistre", pos: "DC", rating: 89 },
            { name: "Rozuya", pos: "DC", rating: 88 },
            { name: "Zewonka", pos: "DD", rating: 86 },
            { name: "K9", pos: "DG", rating: 86 },
            { name: "Benito Artemis", pos: "MC", rating: 90 },
            { name: "Omass", pos: "MC", rating: 88 },
            { name: "Tony", pos: "MOC", rating: 89 },
            { name: "Charly", pos: "AG", rating: 87 },
            { name: "Camille", pos: "AD", rating: 87 },
            { name: "Druly", pos: "BU", rating: 91 },
            { name: "Cocol", pos: "MC", rating: 85 },
            { name: "Bryan", pos: "DC", rating: 85 },
            { name: "Dante", pos: "BU", rating: 88 },
            { name: "Sephirot", pos: "MOC", rating: 90 }
        ];

        let pool = mode === 'laura' ? lauraPool : normalPool;
        let squad = [];
        localStorage.setItem('userSquad', JSON.stringify(squad));
        let draftCount = 0;
        const targetCount = 5;

        if (mode === 'laura') {
            localStorage.setItem('userTeamName', 'House of Laura FC');
        }

        function loadStep() {
            if (draftCount >= targetCount) {
                window.location.href = 'match.html';
                return;
            }

            document.getElementById('info-step').innerText = `Choix du joueur ${draftCount + 1} / ${targetCount}`;
            let shuffled = [...pool].sort(() => 0.5 - Math.random()).slice(0, 3);
            
            let container = document.getElementById('choices');
            container.innerHTML = '';
            shuffled.forEach(p => {
                let card = document.createElement('div');
                card.className = `player-card ${p.legend ? 'legend' : ''}`;
                card.innerHTML = `<div class="rating">${p.rating}</div><div><b>[${p.pos}]</b></div><div>${p.name}</div>`;
                card.onclick = () => {
                    squad.push(p);
                    localStorage.setItem('userSquad', JSON.stringify(squad));
                    draftCount++;
                    loadStep();
                };
                container.appendChild(card);
            });

            renderSquad();
        }

        function renderSquad() {
            let container = document.getElementById('squad-preview');
            container.innerHTML = '';
            squad.forEach(p => {
                let slot = document.createElement('div');
                slot.className = 'squad-slot';
                slot.innerHTML = `<b>[${p.pos}]</b><br>${p.name}<br><span style="color:#eab308;">${p.rating}</span>`;
                container.appendChild(slot);
            });
        }

        loadStep();
    </script>
</body>
</html>
