<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>House of Laura : Le Choc des Légendes - Match</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .score { font-size: 2.5rem; font-weight: bold; color: #facc15; margin: 20px 0; }
        .commentary { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 8px; font-style: italic; color: #38bdf8; font-size: 1.2rem; min-height: 80px; margin: 20px auto; width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .btn { background: #8b5cf6; color: white; padding: 12px 25px; font-size: 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn:hover { background: #7c3aed; }
    </style>
</head>
<body>
    <h2 id="match-title">Match en cours</h2>
    <div class="score" id="score-box">0 - 0</div>
    <p id="time-box" style="font-weight: bold; color: #eab308; font-size: 1.2rem;">0' min</p>

    <div class="commentary" id="comm-box">Coup d'envoi ! House of Laura affronte l'équipe All-Stars Actuels & Légendes !</div>

    <button class="btn" id="next-btn" onclick="nextAction()">Suivre l'action</button>

    <script>
        let teamName = localStorage.getItem('userTeamName') || 'House of Laura FC';
        let squad = JSON.parse(localStorage.getItem('userSquad')) || [];
        let opponent = "All-Stars Actuels & Légendes (Mbappé, Pelé, Zidane...)";
        
        document.getElementById('match-title').innerText = `${teamName} vs ${opponent}`;

        let minute = 0;
        let homeScore = 0;
        let awayScore = 0;

        let avgRating = squad.length > 0 ? squad.reduce((acc, p) => acc + p.rating, 0) / squad.length : 85;

        function nextAction() {
            minute += 15;
            if (minute === 45) {
                alert("C'est la mi-temps ! Laura verrouille sa cage, place à la seconde période.");
            }

            if (minute >= 90) {
                minute = 90;
                document.getElementById('comm-box').innerText = `🏁 Fin du match historique ! Score final : ${homeScore} - ${awayScore}`;
                document.getElementById('next-btn').innerText = "Voir le Classement";
                document.getElementById('next-btn').onclick = () => { window.location.href = 'classement.html'; };
                return;
            }

            let roll = Math.random() * 100;
            if (roll < avgRating - 25) {
                homeScore++;
                let scorer = squad[Math.floor(Math.random() * squad.length)]?.name || "Buteur";
                document.getElementById('comm-box').innerText = `🔥 BUT magique pour ${teamName} ! Inscrit par ${scorer} à la ${minute}e minute face aux légendes !`;
            } else if (roll > 75) {
                awayScore++;
                document.getElementById('comm-box').innerText = `⚡ But adverse des stars mondiales à la ${minute}e minute malgré la parade de Laura...`;
            } else {
                document.getElementById('comm-box').innerText = `⏱️ ${minute}' : Grosse domination, Laura réalise un arrêt spectaculaire dans sa surface !`;
            }

            document.getElementById('score-box').innerText = `${homeScore} - ${awayScore}`;
            document.getElementById('time-box').innerText = `${minute}' min`;
            
            localStorage.setItem('lastHomeScore', homeScore);
            localStorage.setItem('lastAwayScore', awayScore);
        }
    </script>
</body>
</html>
