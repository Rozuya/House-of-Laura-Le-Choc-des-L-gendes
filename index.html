<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>House of Laura : Le Choc des Légendes - Accueil</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; padding-top: 80px; }
        .btn { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; padding: 15px 30px; font-size: 1.2rem; border: none; border-radius: 8px; cursor: pointer; margin: 15px; text-decoration: none; display: inline-block; font-weight: bold; width: 320px; transition: 0.2s; text-transform: uppercase; }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .mode-box { background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 35px; width: 450px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #facc15; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>House of Laura : Le Choc des Légendes</h1>
    <p style="color: #94a3b8; margin-bottom: 30px;">Affronte l'élite du football mondial (Joueurs Actuels & Légendes) avec ton équipe de House of Laura !</p>
    
    <div class="mode-box">
        <p style="margin-bottom: 20px; font-weight: bold; color: #38bdf8;">Prépare ta draft et mène Laura et son équipe vers la gloire.</p>
        <a href="draft.html" class="btn" onclick="initLauraTeam()">Lancer la Draft House of Laura</a>
    </div>

    <script>
        function initLauraTeam() {
            localStorage.setItem('userTeamName', 'House of Laura FC');
        }
    </script>
</body>
</html>
